[project]
name = "tg-connect"
version = "0.1.0"
description = "Telegram Bot API compatible bridge service"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.0,<4.0",
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.0,<3.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
